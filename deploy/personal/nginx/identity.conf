# Terminates TLS for the two public hostnames and proxies to the app containers over the internal
# Docker network. Certificates come entirely from the host's own step-ca issuance/renewal process
# (see ../README.md's "Public access (nginx + step-ca)" section) - this container never requests
# or renews anything itself, it only reads whatever ${TLS_CERTS_DIR} on the NUC currently holds.
# nginx does not reload certificate files on change by itself: run
# `docker compose exec nginx nginx -s reload` (or restart the container) after step-ca renews them.

# Both apps use SignalR (identity-server's /hubs/mfa and /hubs/session, identity-platform's own
# Interactive Server circuit) - without Upgrade/Connection forwarded through, nginx would proxy a
# WebSocket upgrade as a one-shot HTTP request and the connection would just fail to establish.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Without an explicit default_server, nginx treats the first server block below as the catch-all
# for any connection whose SNI/Host doesn't match a known hostname (a bare IP hit, a forged SNI, a
# DNS record pointed here by someone else entirely) - which would otherwise process that request
# using idp.*'s own proxy_pass/Host forwarding. Rejecting the TLS handshake outright for anything
# that isn't one of the two known hostnames closes that off before a request body is ever read.
server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    server_name idp.homenet.dgdevelopment.it;

    ssl_certificate     /etc/nginx/certs/idp.homenet.dgdevelopment.it/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/idp.homenet.dgdevelopment.it/privkey.pem;

    location / {
        proxy_pass http://identity-server:8080;
        proxy_http_version 1.1;
        # The fixed hostname, not $host - this block is only ever reached via a TLS handshake that
        # already matched this exact SNI, but the Host *header* inside the now-decrypted HTTP
        # request is still client-supplied and not re-validated against it; forwarding it verbatim
        # would let a client pick whatever Host identity-server sees (and e.g. ForgotPasswordModel
        # or OidcIssuerProvider build absolute URLs - password reset links, the OIDC issuer - from
        # that Host), regardless of which domain they actually connected to.
        proxy_set_header Host idp.homenet.dgdevelopment.it;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # SignalR connections are long-lived - nginx's 60s default would otherwise kill an idle
        # hub connection and force clients to keep reconnecting.
        proxy_read_timeout 3600s;
    }
}

server {
    listen 443 ssl;
    server_name identity-admin.homenet.dgdevelopment.it;

    ssl_certificate     /etc/nginx/certs/identity-admin.homenet.dgdevelopment.it/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/identity-admin.homenet.dgdevelopment.it/privkey.pem;

    location / {
        proxy_pass http://identity-platform:8080;
        proxy_http_version 1.1;
        # See the idp.* block's own comment above - same reasoning.
        proxy_set_header Host identity-admin.homenet.dgdevelopment.it;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
