name: 01 - Quality Gate

# Runs on every PR into develop - this is the gate the ephemeral develop stack (test-develop.yml)
# and everything downstream implicitly relies on being green before merge. See
# docs/deployment.md's "Quality Gate tooling" section.
#
# Order: Snyk first (dependency scan, fast/cheap - fail before spending time on the rest) -> build
# + unit tests + coverage threshold, wrapped by the SonarQube scan. Both jobs run on dgnuc1 (see
# docs/deployment.md's "everything self-hosted" decision), which only has one execution slot, so
# this is an explicit `needs` chain rather than two parallel jobs racing for it.
#
# CodeQL was tried and removed (see docs/deployment.md's "Quality Gate tooling" - not worth the
# friction on a private repo without GitHub Team/Enterprise: no code-scanning upload, ubuntu-latest
# autobuild couldn't handle the solution, self-hosted build was workable but added a third job
# competing for dgnuc1's one slot). Revisit once/if this moves to a paid GitHub tier.
#
# Needs two repository secrets that don't exist yet (see docs/deployment.md's "Manual, out-of-band
# setup"): SNYK_TOKEN, and SONAR_HOST_URL/SONAR_TOKEN once SonarQube Community Edition is
# running on the NUC. This workflow will fail until those are configured - expected for now.

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  snyk:
    runs-on: [self-hosted, dgnuc1]
    steps:
      - uses: actions/checkout@v4

      # There's a DgDevelopment.Identity.slnx (the newer XML-free solution format), but Snyk's
      # dotnet plugin doesn't recognize it and, without --all-projects, only looks at the repo root
      # and finds nothing ("Could not detect supported target files") - confirmed against Snyk's
      # own docs. --all-projects falls back to detecting each .csproj individually instead.
      - name: Run Snyk to check for dependency and image vulnerabilities
        uses: snyk/actions/dotnet@master
        continue-on-error: false
        with:
          args: --all-projects
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  build-test-sonar:
    # Must run on the self-hosted (NUC) runner, not a GitHub-hosted one - SonarQube is only
    # reachable on the home LAN, a GitHub-hosted runner in the cloud couldn't reach it.
    runs-on: [self-hosted, dgnuc1]
    needs: snyk
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarQube wants full history for blame/new-code analysis

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Java (required by the SonarScanner for .NET)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The bundled JS/TS sensor (for clients/DgDevelopment.Identity.Client.React) needs a Node
      # runtime to execute even though nothing here runs the app itself.
      - name: Setup Node.js (for the JS/TS analyzer)
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install React client dependencies (improves type-aware JS/TS analysis)
        working-directory: clients/DgDevelopment.Identity.Client.React
        run: npm ci

      - name: Install SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner

      # dotnet-sonarscanner wraps the general SonarScanner engine, which analyzes every recognized
      # language under sonar.sources (not just C#) in one pass - so the React client's TS/JS is
      # picked up automatically as long as Node.js is available (setup-node step above). No
      # separate scanner run needed for the JS/TS side.
      - name: Begin SonarQube analysis
        run: >
          dotnet sonarscanner begin
          /k:"DgDevelopment.Identity"
          /d:sonar.host.url="${{ secrets.SONAR_HOST_URL }}"
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
          /d:sonar.cs.cobertura.reportsPaths="tests/**/TestResults/coverage/**/coverage.cobertura.xml"
          /d:sonar.exclusions="**/node_modules/**,**/bin/**,**/obj/**,**/dist/**"

      # Debug config auto-generates coverage via GenerateCoverageAfterBuild in
      # DgDevelopment.Identity.Server.UnitTests.csproj - no extra --collect flags needed here.
      - name: Build and generate coverage
        run: |
          dotnet restore src/DgDevelopment.Identity.AppHost/DgDevelopment.Identity.AppHost.csproj
          dotnet build src/DgDevelopment.Identity.AppHost/DgDevelopment.Identity.AppHost.csproj --no-restore
          dotnet build tests/DgDevelopment.Identity.Server.UnitTests/DgDevelopment.Identity.Server.UnitTests.csproj

      # TODO(implementation): pick a real threshold once there's a stable baseline to tighten from
      # (see docs/deployment.md - "start from roughly the current baseline"). This just fails the
      # build if line coverage drops below the placeholder value.
      - name: Enforce coverage threshold
        run: |
          COVERAGE_FILE=$(find tests/DgDevelopment.Identity.Server.UnitTests/TestResults/coverage -name coverage.cobertura.xml | head -1)
          LINE_RATE=$(grep -oP '(?<=line-rate=")[^"]+' "$COVERAGE_FILE" | head -1)
          THRESHOLD="0.60"
          awk -v rate="$LINE_RATE" -v threshold="$THRESHOLD" 'BEGIN { exit (rate < threshold) }' \
            || { echo "Line coverage $LINE_RATE is below the $THRESHOLD threshold"; exit 1; }

      - name: End SonarQube analysis
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
