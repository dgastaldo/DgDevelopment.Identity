name: Dependabot auto-approve

# Approves Dependabot's own patch/minor dependency-bump PRs so they don't get stuck waiting on a
# human reviewer under this repo's branch ruleset (required_approving_review_count: 1) - a major
# bump still needs an explicit human review, since those are more likely to carry breaking changes.
# pull_request_target (not pull_request) is required for Dependabot PRs to receive repo secrets/
# the default token - safe here since this job only reads PR metadata and posts an approval, it
# never checks out or executes anything from the PR's own branch.

on:
  pull_request_target:
    branches: [develop]

permissions:
  pull-requests: write
  contents: read

jobs:
  auto-approve:
    # github.actor is forgeable (it's whoever triggered this workflow run, not necessarily who
    # opened the PR); github.event.pull_request.user.login reflects the PR's actual author.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2.5.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Approve patch/minor updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
