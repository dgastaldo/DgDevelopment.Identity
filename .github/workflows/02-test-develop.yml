name: 02 - Test develop (ephemeral stack)

# develop is never a persistently-deployed environment - every merge spins up a throwaway Docker
# Compose stack (Server + IdentityPlatform + a containerized SQL Server), proves the deployment
# itself works, and tears it down regardless of outcome. See docs/deployment.md.
#
# DgDevelopment.Identity.IntegrationTests still runs in-process (WebApplicationFactory) for this
# first pass - it doesn't hit the deployed stack yet. Migrating it to real HTTP against this
# ephemeral stack is a deliberate, tracked follow-up phase (see docs/deployment.md's "Open items"),
# not part of this workflow yet. Until then, the "aspire deploy"/"aspire destroy" steps below are a
# smoke test of the deployment mechanism itself (does the Compose stack actually come up cleanly?),
# separate from the application-level regression coverage the test step provides.

on:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, dgnuc1]
    environment: develop
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore and build
        run: |
          dotnet restore src/DgDevelopment.Identity.AppHost/DgDevelopment.Identity.AppHost.csproj
          dotnet build src/DgDevelopment.Identity.AppHost/DgDevelopment.Identity.AppHost.csproj --no-restore

      - name: Run integration tests (in-process, WebApplicationFactory)
        run: >
          dotnet test tests/DgDevelopment.Identity.IntegrationTests/DgDevelopment.Identity.IntegrationTests.csproj
          --no-build --configuration Debug

      - name: Install Aspire CLI
        run: |
          curl -sSL https://aspire.dev/install.sh | bash
          echo "$HOME/.aspire/bin" >> "$GITHUB_PATH"

      - name: Smoke-test the deployment (spin up the ephemeral Compose stack)
        env:
          Parameters__deploy_target: develop
        run: aspire deploy --non-interactive

      # TODO(implementation): confirm the exact way to reach the generated Compose project's logs -
      # depends on where `aspire deploy` writes its Compose output for this AppHost/environment.
      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs || true

      - name: Tear down the ephemeral stack
        if: always()
        env:
          Parameters__deploy_target: develop
        run: aspire destroy --yes --non-interactive
