name: 01 - PR Quality Gate

# Runs on every PR into develop - this is the gate the ephemeral develop stack (test-develop.yml)
# and everything downstream implicitly relies on being green before merge. See
# docs/deployment.md's "Quality Gate tooling" section.
#
# Order: dependency-audit first (vulnerable-package scan, fast/cheap - fail before spending time
# on the rest) -> build + unit tests + coverage threshold. sonar is a separate, optional extra
# (code quality, not a build/test gate) that runs its own build+test in parallel and never blocks
# the PR - same shape as DgDevelopment.PrintServer's build-test/sonar split, so the required
# status checks line up across both repos. All jobs run on GitHub-hosted ubuntu-latest - moved off
# the self-hosted NUC runner deliberately: this workflow triggers on every PR, including (once the
# repo is public) PRs from forks, and self-hosted runners must never execute code reachable from
# an untrusted PR. Platform-specific clients (Client.Wpf today, a Mac/iOS target later) get their
# own compile-only job per OS in parallel - see build-windows/build-macos below. CodeQL runs
# separately, in 02-develop-quality-gate.yml on push to develop - GitHub only populates the
# Security tab's baseline from the default branch, not PRs.
#
# dependency-audit replaced snyk as the required check, and snyk was dropped entirely (not just
# made optional) - same reasoning as DgDevelopment.PrintServer: Snyk's free tier caps out at 200
# tests/month, and every PR (plus every push to a Dependabot PR, which re-tests on each commit)
# burns through that fast, for no coverage `dotnet list package --vulnerable` and `npm audit`
# don't already give against the same NuGet/npm advisory databases, with no quota at all.
#
# dependency-audit's npm audit runs --omit=dev (required, blocking) because devDependencies can
# carry a finding with no fix available upstream (see its own comment below) that would then block
# every PR indefinitely. dependency-audit-full re-runs the same npm audit with every dependency in
# scope, including dev - optional and non-blocking (continue-on-error), purely so a *new*
# devDependency finding is visible on the PR instead of silently invisible, even though it can't
# gate the merge the same way.
#
# sonar authenticates to SonarQube Cloud via secretless OIDC (SonarSource/sonarqube-auth-action) -
# no SONAR_TOKEN secret needed, and no SONAR_ORGANIZATION variable either (the action returns both
# the org and the project key as outputs). Requires an org admin to enable "Secretless analysis for
# GitHub Actions" once in SonarQube Cloud's organization settings. SNYK_TOKEN is optional.

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Client.Maui needs the maui-android workload, which this (and every other non-build-test-
      # sonar/dotnet-list) runner doesn't have installed (NETSDK1147) - same gap as
      # dependency-submission-nuget.yml and the old submit-nuget check, so excluded here the same
      # way: restore/list every project individually instead of the whole .slnx at once.
      - name: Restore and check every project except the MAUI client
        run: |
          find . -type f -name "*.csproj" -not -path "./clients/DgDevelopment.Identity.Client.Maui/*" | while IFS= read -r project; do
            echo "::group::$project"
            dotnet restore "$project"
            dotnet list "$project" package --vulnerable --include-transitive 2>&1 | tee -a vulnerabilities.txt
            echo "::endgroup::"
          done
          if grep -q "has the following vulnerable packages" vulnerabilities.txt; then
            echo "::error::Vulnerable NuGet package(s) found - see the groups above"
            exit 1
          fi

      # package-lock.json already exists for all three - npm audit reads it directly, no
      # npm ci/install needed first. --omit=dev: all three projects' only devDependencies are
      # @tailwindcss/cli/tailwindcss, a build-time-only CSS tool that never runs against
      # untrusted input in CI or production - e.g. GHSA-fc5q-39xc-vjpf (picomatch ReDoS via
      # @parcel/watcher) has no fixed release upstream as of 2026-11-18, so without --omit=dev
      # this gate blocks on every PR indefinitely with no actionable fix. Real runtime
      # dependencies (Server's @microsoft/signalr) are still audited.
      - name: Audit npm dependencies (React client)
        working-directory: clients/DgDevelopment.Identity.Client.React
        run: npm audit --audit-level=high --omit=dev

      - name: Audit npm dependencies (IdentityPlatform admin UI)
        working-directory: src/DgDevelopment.Identity.IdentityPlatform/DgDevelopment.Identity.IdentityPlatform
        run: npm audit --audit-level=high --omit=dev

      - name: Audit npm dependencies (Server)
        working-directory: src/DgDevelopment.Identity.Server
        run: npm audit --audit-level=high --omit=dev

  # Optional, non-blocking: a second pass of the same three npm audits, minus --omit=dev, so a
  # devDependency-only finding (which dependency-audit above deliberately can't gate on - see its
  # comment) still shows up somewhere on the PR instead of being invisible. continue-on-error
  # because a devDependency finding without a fix is still unfixable even once it's visible.
  dependency-audit-full:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Audit npm dependencies, including devDependencies (React client)
        working-directory: clients/DgDevelopment.Identity.Client.React
        run: npm audit --audit-level=high

      - name: Audit npm dependencies, including devDependencies (IdentityPlatform admin UI)
        working-directory: src/DgDevelopment.Identity.IdentityPlatform/DgDevelopment.Identity.IdentityPlatform
        run: npm audit --audit-level=high

      - name: Audit npm dependencies, including devDependencies (Server)
        working-directory: src/DgDevelopment.Identity.Server
        run: npm audit --audit-level=high

  build-test:
    runs-on: ubuntu-latest
    needs: dependency-audit
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Debug config auto-generates coverage.cobertura.xml via GenerateCoverageAfterBuild in
      # DgDevelopment.Identity.Server.UnitTests.csproj - no extra --collect flags needed here, and
      # no reportgenerator/tool install needed either: that project's separate
      # GenerateCoverageReport target (HTML report, needs reportgenerator) is a manual local-only
      # convenience, never run here - CI only needs the raw cobertura.xml for the threshold check.
      - name: Build and generate coverage
        run: |
          dotnet restore src/DgDevelopment.Identity.AppHost/DgDevelopment.Identity.AppHost.csproj
          dotnet build src/DgDevelopment.Identity.AppHost/DgDevelopment.Identity.AppHost.csproj --no-restore
          dotnet build tests/DgDevelopment.Identity.Server.UnitTests/DgDevelopment.Identity.Server.UnitTests.csproj

      # Real baseline established once EF Core's auto-generated migrations were excluded from
      # coverage (coverlet.runsettings) - they were ~94% of Infrastructure's coverable lines, all
      # at 0%, dragging the aggregate down to ~13% even though every real package sits at 83-100%.
      # With migrations excluded, actual coverage is ~85% - 80% leaves a margin without being a
      # rubber stamp.
      - name: Enforce coverage threshold
        run: |
          COVERAGE_FILE=$(find tests/DgDevelopment.Identity.Server.UnitTests/TestResults/coverage -name coverage.cobertura.xml | head -1)
          LINE_RATE=$(grep -oP '(?<=line-rate=")[^"]+' "$COVERAGE_FILE" | head -1)
          THRESHOLD="0.80"
          awk -v rate="$LINE_RATE" -v threshold="$THRESHOLD" 'BEGIN { exit (rate < threshold) }' \
            || { echo "Line coverage $LINE_RATE is below the $THRESHOLD threshold"; exit 1; }

  # Optional, non-blocking: code quality/coverage reporting only, not a build/test gate (build-test
  # above already covers that, required). Runs its own build+test in parallel rather than needing
  # build-test's output, same as PrintServer's independent sonar job.
  sonar:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      id-token: write # secretless SonarQube Cloud auth below - exchanges this for a 30min token
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # SonarQube wants full history for blame/new-code analysis

      # Secretless analysis: exchanges this job's GitHub OIDC identity for a short-lived (30min),
      # project-scoped SonarQube Cloud token - no more long-lived SONAR_TOKEN secret to create,
      # rotate or revoke. Requires an org admin to have enabled "Secretless analysis for GitHub
      # Actions" in SonarQube Cloud's organization settings first (off by default).
      - name: Authenticate to SonarQube Cloud
        id: sonar_auth
        uses: SonarSource/sonarqube-auth-action@a0aa643acde4162396015b4f12536c1b9c4aab82 # v1
        with:
          export-env: "false"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Java (required by the SonarScanner for .NET)
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'

      # The bundled JS/TS sensor (for clients/DgDevelopment.Identity.Client.React) needs a Node
      # runtime to execute even though nothing here runs the app itself.
      - name: Setup Node.js (for the JS/TS analyzer)
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      # --ignore-scripts: @swc/core (the test transform below) ships prebuilt binaries as
      # per-platform optionalDependencies, no install-time script needed to use them - no reason
      # to let one run anyway and execute arbitrary code from a third-party package.
      - name: Install React client dependencies
        working-directory: clients/DgDevelopment.Identity.Client.React
        run: npm ci --ignore-scripts

      # Feeds sonar.javascript.lcov.reportPaths below - without it, every line in this package
      # reads as 0% covered on SonarCloud's new-code gate regardless of the real unit tests.
      - name: Run React client tests with coverage
        working-directory: clients/DgDevelopment.Identity.Client.React
        run: npm run test:coverage

      - name: Install SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner

      # dotnet-sonarscanner wraps the general SonarScanner engine, which analyzes every recognized
      # language under sonar.sources (not just C#) in one pass - so the React client's TS/JS is
      # picked up automatically as long as Node.js is available (setup-node step above). No
      # separate scanner run needed for the JS/TS side.
      # No sonar.host.url - defaults to sonarcloud.io. Project key is "{organization}_{repo}" -
      # SonarCloud generates it in that shape when a project is imported via the GitHub App, shown
      # on the project's own page.
      #
      # sonar.exclusions also drops:
      # - Migrations/: EF Core-generated, never hand-edited - findings there (e.g. "use Guid.Empty"
      #   on a scaffolded `new Guid("000...")` default value) aren't actionable without touching
      #   generated code.
      #
      # sonar.coverage.exclusions:
      # - the two Program.cs are entry points - literal top-level statements that build the
      #   host/DI container, not unit-testable without actually running the app as a subprocess.
      #   Same reasoning as excluding EF Core's migrations from coverage in coverlet.runsettings:
      #   wiring, not business logic.
      # - ConnectController.cs / ExpiredPassword.cshtml.cs / MfaEnroll.cshtml.cs: MVC
      #   controller actions and Razor Page handlers need a real HTTP pipeline to exercise
      #   meaningfully (request binding, model state, HttpContext) - that's IntegrationTests'
      #   job (WebApplicationFactory), which doesn't feed coverage into this job. Excluding them
      #   here isn't "these don't need tests", it's "this specific job can't produce that data" -
      #   revisit once/if IntegrationTests' coverage is wired into the PR gate too.
      # - RateLimitingOptions.cs: RateLimiterFactory.CreatePartitioner *is* unit-tested
      #   (RateLimiterFactoryTests), but that test lives in IntegrationTests, same "job can't
      #   produce that data" gap as ConnectController.cs above - revisit together with it.
      # - SessionEventClient.cs: no HubConnection mocking/test infrastructure exists in this
      #   codebase to exercise its SignalR reconnect path - revisit if that infra gets built.
      # - IdentityPlatform.Client/**: the Blazor WASM client's .razor/.razor.js files, plus its own
      #   Program.cs (the WASM host's entry point - same reasoning as the two Program.cs already
      #   listed above) - no bUnit or other component-test harness exists in this codebase to
      #   exercise any of it. Revisit if that infra gets built.
      # - AzureNotificationHubNotifier.cs / Server's SecurityHeadersMiddleware.cs: no existing unit
      #   tests exercise either (one needs a real HTTP call to Azure, the other a real HTTP
      #   pipeline) - pre-existing gap, not introduced by whatever change touched a line in them.
      # - IdentityPlatform's own SecurityHeadersMiddleware.cs: same gap as Server's one above - no
      #   test harness in this codebase exercises CSP header middleware against a real pipeline.
      # - Register.cshtml.cs: same Razor Page handler gap as ExpiredPassword/MfaEnroll above -
      #   needs WebApplicationFactory, not unit-testable here. Pre-existing 0% on develop.
      # - IdentityClient.cs / IdentityAuthStateProvider.cs: Client.Core/Client.Blazor code that
      #   needs a mocked HttpClient/browser auth pipeline - same no-test-harness gap as
      #   SessionEventClient.cs above. Pre-existing 0% on develop.
      # - AppHost.cs: Aspire's own entry point - same "wiring, not business logic" reasoning as
      #   the two Program.cs already listed. Pre-existing 0% on develop.
      # - Authorize.cshtml.cs / Consent.cshtml.cs: same Razor Page handler gap as
      #   ExpiredPassword/MfaEnroll/Register above. Pre-existing 0% on develop.
      # - AuditController.cs / ClientsController.cs / GroupsController.cs / PlatformsController.cs /
      #   RolesController.cs / TenantsController.cs / UsersController.cs: same MVC-controller gap as
      #   ConnectController.cs above. Pre-existing 0% on develop.
      # - AuditService.cs / IAuditService.cs: AuditService.RecordAsync reads HttpContext (actor
      #   claims, remote IP, user agent) - same real-HTTP-pipeline gap as the controllers above.
      #   Pre-existing 0% on develop.
      # - ServerIdentityAuthStateProvider.cs / SessionMarkerAuthenticationHandler.cs: same
      #   no-test-harness gap as IdentityAuthStateProvider.cs above - both need a real
      #   IHttpContextAccessor/AuthenticationHandler pipeline (cookies, HttpContext.User,
      #   ChallengeAsync's redirect) that no test infra in this codebase exercises yet.
      # - SessionMarkerService.cs / identitySession.js: same no-test-harness gap as
      #   IdentityAuthStateProvider.cs above - needs a real IJSRuntime/browser cookie pipeline
      #   (document.cookie via JS interop) that no test infra in this codebase exercises yet.
      - name: Begin SonarCloud analysis
        run: >
          dotnet sonarscanner begin
          /k:"${{ steps.sonar_auth.outputs.project-key }}"
          /o:"${{ steps.sonar_auth.outputs.organization }}"
          /d:sonar.token="${{ steps.sonar_auth.outputs.sonar-token }}"
          /d:sonar.cs.cobertura.reportsPaths="tests/**/TestResults/coverage/**/coverage.cobertura.xml"
          /d:sonar.javascript.lcov.reportPaths="clients/DgDevelopment.Identity.Client.React/coverage/lcov.info"
          /d:sonar.exclusions="**/node_modules/**,**/bin/**,**/obj/**,**/dist/**,**/Migrations/**"
          /d:sonar.coverage.exclusions="src/DgDevelopment.Identity.Server/Program.cs,src/DgDevelopment.Identity.IdentityPlatform/DgDevelopment.Identity.IdentityPlatform/Program.cs,src/DgDevelopment.Identity.AppHost/AppHost.cs,src/DgDevelopment.Identity.Server/Controllers/ConnectController.cs,src/DgDevelopment.Identity.Server/Controllers/AuditController.cs,src/DgDevelopment.Identity.Server/Controllers/ClientsController.cs,src/DgDevelopment.Identity.Server/Controllers/GroupsController.cs,src/DgDevelopment.Identity.Server/Controllers/PlatformsController.cs,src/DgDevelopment.Identity.Server/Controllers/RolesController.cs,src/DgDevelopment.Identity.Server/Controllers/TenantsController.cs,src/DgDevelopment.Identity.Server/Controllers/UsersController.cs,src/DgDevelopment.Identity.Server/Services/AuditService.cs,src/DgDevelopment.Identity.Application/Services/IAuditService.cs,src/DgDevelopment.Identity.Server/Pages/Account/ExpiredPassword.cshtml.cs,src/DgDevelopment.Identity.Server/Pages/Account/MfaEnroll.cshtml.cs,src/DgDevelopment.Identity.Server/Pages/Account/Register.cshtml.cs,src/DgDevelopment.Identity.Server/Pages/Connect/Authorize.cshtml.cs,src/DgDevelopment.Identity.Server/Pages/Account/Consent.cshtml.cs,clients/DgDevelopment.Identity.Client.Core/SessionEventClient.cs,clients/DgDevelopment.Identity.Client.Core/IdentityClient.cs,clients/DgDevelopment.Identity.Client.Blazor/IdentityAuthStateProvider.cs,src/DgDevelopment.Identity.IdentityPlatform/DgDevelopment.Identity.IdentityPlatform/ServerIdentityAuthStateProvider.cs,src/DgDevelopment.Identity.IdentityPlatform/DgDevelopment.Identity.IdentityPlatform/SessionMarkerAuthenticationHandler.cs,clients/DgDevelopment.Identity.Client.Blazor/SessionMarkerService.cs,clients/DgDevelopment.Identity.Client.Blazor/wwwroot/identitySession.js,src/DgDevelopment.Identity.IdentityPlatform/DgDevelopment.Identity.IdentityPlatform.Client/**,src/DgDevelopment.Identity.Infrastructure/Security/AzureNotificationHubNotifier.cs,src/DgDevelopment.Identity.Server/Security/SecurityHeadersMiddleware.cs,src/DgDevelopment.Identity.ServiceDefaults/RateLimitingOptions.cs,src/DgDevelopment.Identity.IdentityPlatform/DgDevelopment.Identity.IdentityPlatform/Security/SecurityHeadersMiddleware.cs"

      # Debug config auto-generates coverage.cobertura.xml via GenerateCoverageAfterBuild in
      # DgDevelopment.Identity.Server.UnitTests.csproj - no extra --collect flags needed here, and
      # no reportgenerator/tool install needed either: that project's separate
      # GenerateCoverageReport target (HTML report, needs reportgenerator) is a manual local-only
      # convenience, never run here - CI only needs the raw cobertura.xml SonarCloud reads below.
      # Build + test only to feed SonarCloud its coverage report - the coverage threshold itself
      # is enforced by build-test above, not duplicated here since this job never blocks the PR.
      - name: Build and generate coverage
        run: |
          dotnet restore src/DgDevelopment.Identity.AppHost/DgDevelopment.Identity.AppHost.csproj
          dotnet build src/DgDevelopment.Identity.AppHost/DgDevelopment.Identity.AppHost.csproj --no-restore
          dotnet build tests/DgDevelopment.Identity.Server.UnitTests/DgDevelopment.Identity.Server.UnitTests.csproj

      - name: End SonarQube analysis
        run: dotnet sonarscanner end /d:sonar.token="${{ steps.sonar_auth.outputs.sonar-token }}"

  # Platform-specific clients can't build on ubuntu-latest (a job is pinned to one runs-on, and
  # there's no shared logic worth forcing into one matrix), so they'd get their own job per OS in
  # parallel with the Linux-only chain above, compile-only (no Sonar/CodeQL), same shape as
  # 06-publish-client-maui.yml's build-windows job:
  #
  # build-windows:
  #   runs-on: windows-latest
  #   steps:
  #     - uses: actions/checkout@v7
  #     - uses: actions/setup-dotnet@v6
  #       with:
  #         dotnet-version: 10.0.x
  #     - run: dotnet build clients/DgDevelopment.Identity.Client.Wpf/DgDevelopment.Identity.Client.Wpf.csproj -c Release
  #
  # Left commented out: Client.Wpf is still an empty scaffold (no .xaml/code, plain net10.0 TFM,
  # no UseWPF) - compiling it today catches nothing and just burns CI time. Uncomment once it has
  # real WPF code (net10.0-windows + UseWPF). build-macos: add the same way once there's a real
  # Mac/iOS target (e.g. Client.Maui gains a net10.0-maccatalyst/net10.0-ios TFM), runs-on: macos-latest.
