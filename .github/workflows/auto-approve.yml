name: Auto-approve

# Approves PRs so they don't get stuck waiting on a human reviewer under this repo's branch ruleset
# (required_approving_review_count: 1):
#   - Dependabot's own patch/minor dependency-bump PRs, every ecosystem - a major bump still needs
#     an explicit human review for most ecosystems, since those are more likely to carry breaking
#     changes, EXCEPT GitHub Actions: a major action version bump is routine and low-risk (actions
#     are pinned to a full commit SHA throughout this repo's own workflows anyway, so a bad release
#     can't silently slide in), so those are auto-approved regardless of bump type.
#   - PRs opened by the repository owner from a branch of this same repository (never from a fork),
#     once they are no longer drafts.
# The approval comes from github-actions[bot], so it is a different identity from the PR author. The
# required status checks still have to pass and the merge itself stays a manual click.
# Plain pull_request (not pull_request_target): Dependabot opens its PRs from branches of this same
# repository, not forks, so the default GITHUB_TOKEN and repo secrets are already available without
# needing pull_request_target's elevated, base-branch-pinned execution model - which GitHub is
# blocking by default on public repos from 2026-12-02 unless an Actions policy explicitly allows it
# (see https://gh.io/securely-using-pull_request_target#default-policy-for-pull_request_target).
# A real fork PR would simply get a read-only token and no secrets under this trigger, same as any
# other pull_request workflow - this job would just fail to approve rather than do anything unsafe.

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  pull-requests: write
  contents: read

jobs:
  auto-approve:
    # github.actor is forgeable (it's whoever triggered this workflow run, not necessarily who
    # opened the PR); github.event.pull_request.user.login reflects the PR's actual author.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' ||
      (github.event.pull_request.user.login == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Approve
        if: >-
          github.event.pull_request.user.login != 'dependabot[bot]' ||
          steps.metadata.outputs.update-type != 'version-update:semver-major' ||
          steps.metadata.outputs.package-ecosystem == 'github_actions'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
