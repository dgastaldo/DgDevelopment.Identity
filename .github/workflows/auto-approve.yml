name: Auto-approve

# Approves PRs so they don't get stuck waiting on a human reviewer under this repo's branch ruleset
# (required_approving_review_count: 1):
#   - Dependabot's own patch/minor dependency-bump PRs - a major bump still needs an explicit human
#     review, since those are more likely to carry breaking changes.
#   - PRs opened by the repository owner from a branch of this same repository (never from a fork),
#     once they are no longer drafts.
# The approval comes from github-actions[bot], so it is a different identity from the PR author. The
# required status checks still have to pass and the merge itself stays a manual click.
# pull_request_target (not pull_request) is required for Dependabot PRs to receive repo secrets/
# the default token - safe here since this job only reads PR metadata and posts an approval, it
# never checks out or executes anything from the PR's own branch.

on:
  pull_request_target:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  pull-requests: write
  contents: read

jobs:
  auto-approve:
    # github.actor is forgeable (it's whoever triggered this workflow run, not necessarily who
    # opened the PR); github.event.pull_request.user.login reflects the PR's actual author.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' ||
      (github.event.pull_request.user.login == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2.5.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Approve
        if: github.event.pull_request.user.login != 'dependabot[bot]' || steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
