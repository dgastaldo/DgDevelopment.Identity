name: 06 - Publish Client.Maui

# Fires once release-please's Release PR for Client.Maui gets merged (that merge is what creates
# the client-maui-v* tag). Builds an unpackaged Windows zip plus an Android APK, and publishes
# both to a GitHub Release. See docs/deployment.md's "Client.Maui distribution" section.
#
# TODO(implementation): a signed MSIX build was dropped for now - no signing certificate exists
# yet (see docs/deployment.md's "Manual, out-of-band setup"). Re-add the "Decode the signing
# certificate" / "Publish signed MSIX" steps once WINDOWS_SIGNING_CERT_BASE64 and
# WINDOWS_SIGNING_CERT_PASSWORD are provisioned.

on:
  push:
    tags: ['client-maui-v*']

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI workload
        run: dotnet workload install maui-windows

      - name: Publish unpackaged (zip)
        run: >
          dotnet publish clients/DgDevelopment.Identity.Client.Maui
          -f net10.0-windows10.0.19041.0 -c Release
          -p:WindowsPackageType=None
          -o publish/unpackaged

      - name: Zip the unpackaged build
        run: Compress-Archive -Path publish/unpackaged/* -DestinationPath client-maui-windows.zip
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: client-maui-windows.zip

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Publish Android APK
        run: >
          dotnet publish clients/DgDevelopment.Identity.Client.Maui
          -f net10.0-android -c Release
          -o publish/android

      - uses: actions/upload-artifact@v4
        with:
          name: android-artifact
          path: publish/android/**/*.apk

  release:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write # only this job actually creates the GitHub Release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            artifacts/windows-artifacts/client-maui-windows.zip \
            artifacts/android-artifact/publish/android/*.apk \
            --title "Client.Maui ${{ github.ref_name }}" \
            --generate-notes
